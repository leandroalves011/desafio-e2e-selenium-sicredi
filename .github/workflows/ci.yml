name: Automacao E2E Sicredi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Conceder permissao de execucao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar os testes E2E (Modo Headless)
        run: ./gradlew clean test -Dheadless=true
        continue-on-error: true

      - name: Gerar Relatorio Allure
        if: always()
        run: ./gradlew allureReport

      - name: Disponibilizar Relatorio HTML como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report
          retention-days: 14